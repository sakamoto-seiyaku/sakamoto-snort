unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /tmp/sakamoto-vpp-nfq-poc/s119-vpp-run
  poll-sleep-usec 1000
  log /tmp/sakamoto-vpp-nfq-poc/s119-vpp-hev-worker.log
  cli-listen /tmp/sakamoto-vpp-nfq-poc/s119-hev-worker-cli.sock
}

cpu {
  workers 2
}

api-segment {
  prefix sakamoto-vpp-nfq-poc-s119
}

statseg {
  socket-name /tmp/sakamoto-vpp-nfq-poc/s119-statseg.sock
}

buffers {
  page-size default
}

plugins {
  plugin default { disable }
  plugin hev_worker_step_poc_plugin.so { enable }
}
