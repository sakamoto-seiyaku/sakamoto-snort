unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /tmp/sakamoto-vpp-nfq-poc/s120-vpp-run
  poll-sleep-usec 1000
  log /tmp/sakamoto-vpp-nfq-poc/s120-vpp-hev-external-driver.log
  cli-listen /tmp/sakamoto-vpp-nfq-poc/s120-hev-external-driver-cli.sock
}

cpu {
  workers 2
}

api-segment {
  prefix sakamoto-vpp-nfq-poc-s120
}

statseg {
  socket-name /tmp/sakamoto-vpp-nfq-poc/s120-statseg.sock
}

buffers {
  page-size default
}

plugins {
  path /tmp/s119-vpp-build/lib/x86_64-linux-gnu/vpp_plugins
  plugin default { disable }
  plugin hev_external_driver_poc_plugin.so { enable }
}
