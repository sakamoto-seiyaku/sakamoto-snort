unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /tmp/sakamoto-vpp-nfqueue-s73/vpp-run
  poll-sleep-usec 1000
  log /tmp/sakamoto-vpp-nfqueue-s73/vpp.log
  cli-listen /tmp/sakamoto-vpp-nfqueue-s73/cli.sock
}

cpu {
  main-core 0
  corelist-workers 1
}

api-segment {
  prefix sakamoto-vpp-nfqueue-s73
}

statseg {
  socket-name /tmp/sakamoto-vpp-nfqueue-s73/statseg.sock
}

buffers {
  # The S73 9000-byte data patch yields a 9280-byte VPP buffer including its
  # header; a hugepage-sized backing page is required on 4K-page hosts.
  page-size 2M
}

plugins {
  path /tmp/sakamoto-vpp-nfqueue-s73/plugins
  plugin default { disable }
  plugin nfqueue_live_poc_plugin.so { enable }
}
