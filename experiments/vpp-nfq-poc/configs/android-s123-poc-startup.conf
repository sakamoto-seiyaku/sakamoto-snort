unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /data/local/tmp/s122-vpp/runtime
  log /data/local/tmp/s122-vpp/logs/vpp.log
  cli-listen /data/local/tmp/s122-vpp/runtime/cli.sock
  cli-no-pager
}

api-segment {
  prefix vpp-nfq-poc-s123
}

statseg {
  socket-name /data/local/tmp/s122-vpp/runtime/statseg.sock
}

buffers {
  page-size default
}

cpu {
  main-core 0
  corelist-workers 1
}

plugins {
  path /data/local/tmp/s122-vpp/plugins
  plugin default { disable }
  plugin hev_external_driver_poc_plugin.so { enable }
}
