unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir __S77_RUNTIME_ROOT__
  poll-sleep-usec 1000
  log __S77_RUNTIME_ROOT__/vpp.log
  cli-listen __S77_RUNTIME_ROOT__/cli.sock
}

cpu {
  main-core 0
  corelist-workers 1-2
}

api-segment {
  prefix sakamoto-vpp-nfqueue-s77
}

statseg {
  socket-name __S77_RUNTIME_ROOT__/statseg.sock
}

buffers {
  # The S73 9000-byte data patch yields a 9280-byte VPP buffer including the
  # header; a hugepage-sized backing page is required on 4K-page hosts.
  page-size 2M
}

plugins {
  path __S77_RUNTIME_ROOT__/plugins
  plugin default { disable }
  plugin nfqueue_live_poc_plugin.so { enable }
}
