unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /tmp/sakamoto-vpp-nfqueue-s77
  poll-sleep-usec 1000
  log /tmp/sakamoto-vpp-nfqueue-s77/vpp.log
  cli-listen /tmp/sakamoto-vpp-nfqueue-s77/cli.sock
}

cpu {
  main-core 0
  corelist-workers 1-2
}

api-segment {
  prefix sakamoto-vpp-nfqueue-s77
}

statseg {
  socket-name /tmp/sakamoto-vpp-nfqueue-s77/statseg.sock
}

buffers {
  # The S73 9000-byte data patch yields a 9280-byte VPP buffer including the
  # header; a hugepage-sized backing page is required on 4K-page hosts.
  page-size 2M
}

plugins {
  path /tmp/sakamoto-vpp-nfqueue-s77/plugins
  plugin default { disable }
  plugin nfqueue_live_poc_plugin.so { enable }
}
