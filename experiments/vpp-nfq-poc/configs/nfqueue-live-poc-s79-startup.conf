unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir __S79_RUNTIME_ROOT__
  poll-sleep-usec 1000
  log __S79_RUNTIME_ROOT__/vpp.log
  cli-listen __S79_RUNTIME_ROOT__/cli.sock
}

cpu {
  main-core 0
  corelist-workers 1-2
}

api-segment {
  prefix sakamoto-vpp-nfqueue-s79
}

statseg {
  socket-name __S79_RUNTIME_ROOT__/statseg.sock
}

buffers {
  # S73's pinned source patch supplies the measured contiguous 9000-byte span.
  page-size 2M
}

plugins {
  path __S79_RUNTIME_ROOT__/plugins
  plugin default { disable }
  plugin nfqueue_live_poc_plugin.so { enable }
}
