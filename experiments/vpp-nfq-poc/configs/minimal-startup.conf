unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /tmp/sakamoto-vpp-nfq-poc/vpp-run
  poll-sleep-usec 1000
  log /tmp/sakamoto-vpp-nfq-poc/vpp.log
  cli-listen /tmp/sakamoto-vpp-nfq-poc/cli.sock
}

api-segment {
  prefix sakamoto-vpp-nfq-poc
}

statseg {
  socket-name /tmp/sakamoto-vpp-nfq-poc/statseg.sock
}

buffers {
  page-size default
}

plugins {
  plugin default { disable }
}
