unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /data/local/tmp/s126-oi1-replay/runtime
  log /data/local/tmp/s126-oi1-replay/logs/vpp.log
  cli-listen /data/local/tmp/s126-oi1-replay/runtime/cli.sock
}

api-segment {
  prefix vpp-nfq-poc-oi1-replay
}

socksvr {
  socket-name /data/local/tmp/s126-oi1-replay/runtime/api.sock
}

buffers {
  page-size default
}

cpu {
  main-core 0
  corelist-workers 1
}

plugins {
  path /data/local/tmp/s126-oi1/plugins
  plugin default { disable }
  plugin hev_external_driver_poc_plugin.so { enable }
}
