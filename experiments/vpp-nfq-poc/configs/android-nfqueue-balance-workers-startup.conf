unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir /data/local/tmp/vpp-nfqb-poc/runtime
  log /data/local/tmp/vpp-nfqb-poc/logs/vpp.log
  cli-listen /data/local/tmp/vpp-nfqb-poc/runtime/cli.sock
}

cpu {
  main-core 0
  corelist-workers 1-2
}

api-segment {
  prefix vpp-nfqb-poc
}

statseg {
  socket-name /data/local/tmp/vpp-nfqb-poc/runtime/statseg.sock
}

buffers {
  page-size default
}

plugins {
  path /data/local/tmp/vpp-nfqb-poc/plugins
  plugin default { disable }
  plugin nfqueue_poc_plugin.so { enable }
}
