unix {
  nodaemon
  nobanner
  full-coredump
  runtime-dir __S78_RUNTIME_ROOT__
  poll-sleep-usec 1000
  log __S78_RUNTIME_ROOT__/vpp.log
  cli-listen __S78_RUNTIME_ROOT__/cli.sock
}

cpu {
  main-core 0
  corelist-workers 1-2
}

api-segment {
  prefix sakamoto-vpp-nfqueue-s78
}

statseg {
  socket-name __S78_RUNTIME_ROOT__/statseg.sock
}

buffers {
  # The S73 pinned source patch supplies the measured contiguous 9000-byte
  # data span.  Reserve entries are taken from this existing VPP pool.
  page-size 2M
}

plugins {
  path __S78_RUNTIME_ROOT__/plugins
  plugin default { disable }
  plugin nfqueue_live_poc_plugin.so { enable }
}
