<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sakamoto · 三个交互方向</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeefea;color:#1e2822;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}header,main{max-width:1560px;margin:auto;padding:42px 40px}header{padding-bottom:20px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#67766c}h1{font-size:38px;letter-spacing:-1.8px;margin:14px 0}p{color:#677169;line-height:1.8;font-size:14px;max-width:780px}section{padding:24px 0 48px;border-top:1px solid #d7ddd6}section h2{font-size:22px;font-weight:600;margin:0 0 8px;letter-spacing:-.6px}a{color:#285642;text-decoration:none;font-size:13px}a:hover{text-decoration:underline}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.pair{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px;align-items:start}.desktop{height:590px;overflow:hidden;border:1px solid #d4dad3;border-radius:14px;background:#f7f8f4;position:relative}.desktop iframe{position:absolute;left:0;top:0;width:1280px;height:850px;border:0;transform:scale(var(--scale,.69));transform-origin:top left}.phone{height:680px;overflow:hidden;border:7px solid #222923;border-radius:34px;background:#f9faf6;position:relative}.phone iframe{position:absolute;left:0;top:0;width:430px;height:960px;border:0;transform:scale(.69);transform-origin:top left}.caption{font-size:11px;color:#768077;margin-bottom:9px;letter-spacing:.05em}.principles{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}.principles span{font-size:12px;background:#e2e8df;padding:8px 12px;border-radius:6px}footer{padding:0 40px 40px;max-width:1560px;margin:auto;font-size:12px;color:#737e74}@media(max-width:1000px){.pair{grid-template-columns:1fr}.phone{width:310px}.heading{align-items:start;gap:15px}header,main{padding:26px 20px}h1{font-size:29px}section h2{font-size:19px}}
</style></head>
<body><header><div class="eyebrow">SAKAMOTO / DESIGN STUDY 01</div><h1>同一份能力，三种使用方式。</h1><p>比较信息层级与操作路径。每套方案都覆盖控制对象、规则与分配、域名列表、访问统计、配置和运行管理。地图等扩展置于次级入口。所有操作使用示例数据，仅在本页内变化。</p><div class="principles"><span>聚焦</span><span>直觉</span><span>精确</span><span>克制</span><span>连贯</span><span>完成度</span></div></header><main id="gallery"></main><footer>Android 使用应用身份；Linux 示例按系统用户归属，未假设已有进程级控制。Checkpoint 不在本轮原型中。每个方向可打开独立页面操作。</footer>
<script>
const variants=[['A','对象与详情','围绕一个应用或用户完成控制，在同一上下文里查看规则与访问。'],['B','活动时间线','先看到一次访问，顺着原因进入控制。让结果成为操作的起点。'],['C','规则工作台','把规则、作用对象和验证放在同一工作空间，降低复杂编辑的往返。']];
document.querySelector('#gallery').innerHTML=variants.map(([v,title,desc])=>`<section><div class="heading"><div><h2>${v} · ${title}</h2><p>${desc}</p></div><a href="directions.html?variant=${v}&platform=linux" target="_blank">打开此方案 ↗</a></div><div class="pair"><div><div class="caption">LINUX · 桌面</div><div class="desktop"><iframe title="${title} Linux" src="directions.html?variant=${v}&platform=linux&embed=1"></iframe></div></div><div><div class="caption">ANDROID · 手机　<a href="directions.html?variant=${v}&platform=android" target="_blank">打开 ↗</a></div><div class="phone"><iframe title="${title} Android" src="directions.html?variant=${v}&platform=android&embed=1"></iframe></div></div></div></section>`).join('');
function resize(){document.querySelectorAll('.desktop').forEach(el=>{const s=el.clientWidth/1280;el.style.setProperty('--scale',s);el.style.height=(850*s)+'px'})}addEventListener('resize',resize);resize();
</script></body></html>
