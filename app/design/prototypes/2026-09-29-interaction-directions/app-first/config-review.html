<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>审阅导入 · Sakamoto</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages.js"></script>
  <link rel="stylesheet" href="css/experience.css"></head>
  <body
    data-page="config-review"
    data-title="审阅导入"
    data-nav="settings"
    data-back="config-import.html"
  >
    <div class="device">
      <div class="statusbar" aria-hidden="true"></div>
      <aside class="desktop-nav" aria-label="桌面导航"></aside>
      <header class="topbar"></header>
      <div class="status-strip"></div>
      <main class="screen">
        <div class="desktop-narrow">
          <header class="page-intro">
            <div class="eyebrow"></div>
            <h1>确认将要改变的内容</h1>
            <p>这次导入将完整替换当前规则配置。</p>
          </header>
          <div id="config-import-comparison"></div>
          <div class="notice warn">
            <span data-icon="info"></span>
            <p>
              继续后，当前规则、规则组、分配和域名列表将被替换。历史记录与显示偏好保留。
            </p>
          </div>
          <a class="btn full" id="export-before-import"
            ><span data-icon="download"></span>先导出现有配置</a
          >
          <div class="form-error" id="form-error" role="alert"></div>
        </div>
      </main>
      <div class="footer-action">
        <button class="btn primary" id="confirm-import">确认替换配置</button>
      </div>
      <nav class="bottom-nav" aria-label="主要导航"></nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </body>
</html>
