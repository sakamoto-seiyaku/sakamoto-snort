<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>规则组详情 · Sakamoto</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages.js"></script>
  <link rel="stylesheet" href="css/experience.css"></head>
  <body
    data-page="group-detail"
    data-title="规则组详情"
    data-nav="rules"
    data-back="groups.html"
  >
    <div class="device">
      <div class="statusbar" aria-hidden="true"></div>
      <aside class="desktop-nav" aria-label="桌面导航"></aside>
      <header class="topbar"></header>
      <div class="status-strip"></div>
      <main class="screen">
        <div class="desktop-wide">
          <div id="group-detail-main"></div>
          <div class="desktop-grid">
            <section>
              <div class="section-heading">
                <h2>包含的内容</h2>
                <a class="text-link" id="group-edit-link">编辑</a>
              </div>
              <div id="group-members"></div>
            </section>
            <section>
              <div class="section-heading">
                <h2>分配与执行方式</h2>
                <a class="text-link" id="group-assign-link">添加分配</a>
              </div>
              <div id="group-assignments"></div>
              <button
                class="text-link"
                id="delete-group"
                style="color: var(--red)"
              >
                删除规则组
              </button>
            </section>
          </div>
          <div class="form-error" id="form-error" role="alert"></div>
        </div>
      </main>
      <nav class="bottom-nav" aria-label="主要导航"></nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </body>
</html>
