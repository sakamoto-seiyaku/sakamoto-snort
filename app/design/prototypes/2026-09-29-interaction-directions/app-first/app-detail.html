<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>应用 · Sakamoto</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/experience.css" />
    <script type="module" src="js/pages.js"></script>
  </head>
  <body
    class="experience"
    data-page="app-detail"
    data-title="应用"
    data-nav="home"
    data-back="home.html"
  >
    <div class="device">
      <div class="statusbar" aria-hidden="true"></div>
      <aside class="desktop-nav" aria-label="主要导航"></aside>
      <header class="topbar"></header>
      <div class="status-strip"></div>
      <main class="screen">
        <div class="experience-content">
          <div id="application-heading"></div>
          <div class="application-layout">
            <section>
              <div class="app-traffic" id="app-traffic"></div>
              <div id="app-counts" class="app-counts"></div>
              <a class="settings-entry" id="app-controls-link"
                ><span
                  class="settings-symbol"
                  data-icon="sliders-horizontal"
                ></span
                ><span class="grow"
                  ><strong>我的联网设置</strong
                  ><small id="app-control-summary"></small></span
                ><span data-icon="chevron-right"></span
              ></a>
              <div class="app-secondary-links">
                <a id="app-stats-link">统计</a><a id="app-map-link">连接地图</a
                ><a id="app-rules-link">适用规则</a>
              </div>
            </section>
            <section>
              <div id="app-connection-preview"></div>
              <div class="section-heading">
                <h2>域名查询</h2>
                <a id="app-activity-link" class="text-link">查看全部</a>
              </div>
              <div id="app-recent-activity"></div>
              <div id="app-last-decision"></div>
            </section>
          </div>
        </div>
      </main>
      <nav class="bottom-nav" aria-label="主要导航"></nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </body>
</html>
