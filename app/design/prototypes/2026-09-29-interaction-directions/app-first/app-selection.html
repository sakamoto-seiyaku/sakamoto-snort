<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>批量控制 · Sakamoto</title>
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/pages.js"></script>
  <link rel="stylesheet" href="css/experience.css"></head>
  <body
    data-page="app-selection"
    data-title="批量控制"
    data-nav="apps"
    data-back="apps.html"
  >
    <div class="device">
      <div class="statusbar" aria-hidden="true"></div>
      <aside class="desktop-nav" aria-label="桌面导航"></aside>
      <header class="topbar"></header>
      <div class="status-strip"></div>
      <main class="screen">
        <div class="desktop-narrow">
          <header class="page-intro">
            <div class="eyebrow"></div>
            <h1>一起管理</h1>
            <p>选择需要更改网络访问的控制对象。</p>
          </header>
          <div id="batch-subjects" class="stack"></div>
          <h2 class="section-label">操作</h2>
          <div class="field">
            <label for="batch-mode">网络访问</label
            ><select id="batch-mode">
              <option value="block">添加全网络快捷限制</option>
              <option value="release">解除全网络快捷限制</option>
            </select>
          </div>
          <div class="notice">
            <span data-icon="info"></span>
            <p>逐项保存并展示结果。解除快捷限制不会移除已有的共享规则。</p>
          </div>
          <div id="batch-results"></div>
          <div class="form-error" id="form-error" role="alert"></div>
        </div>
      </main>
      <div class="footer-action">
        <button class="btn primary" id="save-batch">应用到所选对象</button>
      </div>
      <nav class="bottom-nav" aria-label="主要导航"></nav>
      <div class="home-indicator" aria-hidden="true"></div>
    </div>
  </body>
</html>
