[package]
name = "sakamoto-product-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
idna = "=1.0.3"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"

[lib]
name = "sakamoto_product_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "sakamoto-product-core-host"
path = "src/main.rs"
