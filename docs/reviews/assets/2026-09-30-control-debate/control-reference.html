function begin(kind,actor){holdDraft();state.draft=fresh(kind,actor);state.previewContext=null;state.note='';state.previewSnapshot='本次输入';state.previewType=kind==='query'?'查询':'连接';if(kind==='map')state.draft.pairs=pairs.filter(function(p){return state.pairSelected.indexOf(p.id)>=0;});go('change');}
function remember(){state.stack.push({view:state.view,scroll:content.scrollTop});}
function go(view,push){if(push!==false&&view!==state.view)remember();state.view=view;state.note='';render();content.scrollTop=0;}
function back(){var last=state.stack.pop();if(last){state.view=last.view;render();content.scrollTop=last.scroll;}else go('overview',false);}

function proposedScopes(d){if(d.kind==='map'){var rows=[];d.pairs.forEach(function(p){var r=rows.find(function(x){return x.uid===uid(p.actor);});if(!r){r={uid:uid(p.actor),label:identity(p.actor),ips:[]};rows.push(r);}if(r.ips.indexOf(p.ip)<0)r.ips.push(p.ip);});return rows.map(function(r){return '<tr><td>'+esc(r.label)+'</td><td>'+r.ips.map(esc).join('<br>')+'</td></tr>';}).join('');}return '<tr><td>'+esc(identity(d.actor))+'</td><td>'+esc(d.target||'所选使用关系')+'</td></tr>';}
function bindConflict(d){return d.kind==='group-mode'&&d.groupMode==='observe'&&(state.source?state.source.directFF:state.directFF)&&!d.removeDirect;}
function applyPayload(d){
 if(d.kind==='stop-group'){state.groupFF=false;if(linux())state.groupSignal=false;}
 if(d.kind==='separate'){state.groupFF=false;state.directFF=false;state.separated=true;if(linux()){state.groupSignal=false;}}
 if(d.kind==='group-mode'){state.groupFFMode=d.groupMode;if(d.removeDirect)state.directFF=false;if(linux())state.groupSignalMode=d.groupMode;}
 if(d.kind==='quick'||d.kind==='networks'){state.quick[d.actor]=true;if(linux())Object.keys(state.quick).forEach(function(a){state.quick[a]=true;});}
 if(d.kind==='list-adopt'){state.listActive='D13';state.listCandidate=false;}
 if(d.unused)state.savedUnused.push(d.name);
 if(d.kind==='clear'){state.groupFF=false;state.groupSignal=false;state.directFF=false;state.separated=false;Object.keys(state.quick).forEach(function(a){state.quick[a]=false;});}
 if(d.kind==='bulk'){state.ruleSet=clone(d.rules);state.groupFFMode=d.bindingFF;state.groupSignalMode=d.bindingSignal;state.listActive=d.listVersion;state.bulkBindings=(d.selectedActors||[]).map(function(a){return {uid:uid(a),actor:a,mode:'enforce',rules:d.rules.filter(function(r){return /^(new-|added-|copy-)/.test(r.id);}).map(function(r){return r.id;})};});state.ruleSet.forEach(function(r){if(state.bulkBindings.some(function(b){return b.rules.indexOf(r.id)>=0;}))r.used=true;});}
}
function save(){
 var d=state.draft;if(!d)return;
 if(bindConflict(d)){state.note='同一控制身份的统计域名规则，同时通过直接执行和组观察引入。尚未保存；请检查并调整已有使用。';render();return;}
 if((d.kind==='map'&&!d.pairs.length)||(d.kind==='networks'&&!d.networks.length)){state.note='尚未选择实际作用范围。输入保留，没有保存。';render();return;}
 if(state.response==='save-error'){state.result={kind:'save-error',draft:JSON.parse(JSON.stringify(d))};go('result');return;}
 if(d.base!==state.saved){state.result={kind:'conflict',draft:JSON.parse(JSON.stringify(d))};go('result');return;}
 if(state.response==='conflict'){state.saved+=2;state.active=state.saved;state.result={kind:'conflict',draft:JSON.parse(JSON.stringify(d))};go('result');return;}
 var old=configSnapshot();useConfig(state.source);applyPayload(d);var candidate=configSnapshot();useConfig(old);
 state.saved+=1;state.source=clone(candidate);state.listSaved=candidate.listActive;
 state.pending={draft:clone(d),config:clone(candidate)};state.draft.base=state.saved;
 if(state.response==='unapplied'){state.result={kind:'unapplied',draft:clone(d)};go('result');return;}
 state.active=state.saved;state.running=clone(candidate);useConfig(state.running);state.pending=null;state.result={kind:'success',draft:clone(d)};go('result');
}

 else if(a==='confirm-new-debug'){var old=state.debug;state.debug={id:'D'+(Number(old.id.slice(1))+1),status:'idle',scope:'',startedVersion:null,events:[],origin:null,followPaused:false};go('deep');}

 else if(a==='download-debug'){download('reference-'+state.debug.id+'.json',JSON.stringify({referenceOnly:true,session:state.debug},null,2),'application/json');}
});
document.addEventListener('input',function(e){var x=e.target;if(x.dataset.workField){var w=keepWork(),r=ruleBy(state.workSelected,w.rules);r[x.dataset.workField]=x.type==='number'?Number(x.value):x.value;w.dirty=true;}if(x.id==='work-input')state.workInput=x.value;});
document.addEventListener('change',function(e){var x=e.target;if(x.dataset.workRule){var r=ruleBy(x.dataset.workRule,keepWork().rules);r.selected=x.checked;}if(x.dataset.workActor){var w=keepWork();w.selectedActors=w.selectedActors.filter(function(a){return a!==x.dataset.workActor;});if(x.checked)w.selectedActors.push(x.dataset.workActor);}if(x.dataset.workField){var r=ruleBy(state.workSelected,keepWork().rules);r[x.dataset.workField]=x.type==='number'?Number(x.value):x.value;}});
views['new-debug']=function(){return heading('已有 '+state.debug.id+' 临时结果','开始另一个会话','新会话复用同一工作位置，原证据引用不换成新会话。')+notice('新会话会替换本页上一临时证据。需要保留时，先导出；不建立无限诊断档案。')+'<div class="actions">'+act('先导出上一会话','export-debug','secondary')+act('明确开始新会话','confirm-new-debug','primary')+'</div>'+route('取消，保留上一结果','deep');};
document.getElementById('play').addEventListener('click',function(){state.played=true;state.normalFacts=state.normalFacts||[];state.normalFacts.push({time:state.view==='future'?'09:45:30':'09:43:50',version:state.active,uid:uid(state.actor),scope:identity(state.actor)});addDebugSample(false);render();});
var lateButton=document.createElement('button');lateButton.textContent='播放晚到旧版本证据';lateButton.id='play-late';document.getElementById('play').after(lateButton);lateButton.addEventListener('click',function(){addDebugSample(true);render();});
document.getElementById('reset').addEventListener('click',function(){var next=new URL(location.href);next.searchParams.set('view','overview');location.href=next;});
window.controlReference={state:state,show:go};
render();
})();
</script>
</body>
