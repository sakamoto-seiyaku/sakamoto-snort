function reviewView(){return `<div class="page-title"><div><p class="subhead">跟踪域名 · 尚未采用</p><h2>采用新资料</h2></div><button class="link" data-action="source">核对来源 ›</button></div><div class="two-cols"><section class="pane"><div class="versions"><div><span>正在使用</span><strong>2026.09.29.1</strong></div><div class="candidate"><span>这次候选</span><strong>2026.09.29.2</strong></div></div><div class="section-title"><h3>名单内容的变化</h3></div><div class="diff"><span class="sign">＋</span><div><strong>cdn-metrics.example.org</strong><p class="subhead">新增匹配 · 仅此名称</p></div></div><div class="diff removed"><span class="sign">−</span><div><strong>events.example.org</strong><p class="subhead">移出匹配 · 仅此名称</p></div></div><section class="preserve"><h4>你的本地修改保持原样</h4><p>补充 local.example.net · 仅此名称<br>排除 api.metrics.example.net · 仅此名称</p></section><p class="subhead">后续活动由引用规则按新资料判断；增删名单内容不等于保证访问允许或阻止。</p>${narrow()?`<section class="section-rule"><h4>供这些规则判断后续活动</h4><p>${linux()?'js（UID1000） · 连接与名称查询 · 执行阻止规则':'Firefox、Signal · 连接 · 执行阻止规则<br>天气 · 名称查询 · 执行阻止规则'}</p><button class="link small" data-action="usage">核对完整使用关系 →</button></section>`:''}<div class="review-footer"><button class="primary" data-action="adopt">使用这份新资料</button><button class="link" data-action="defer">暂不采用</button></div><p class="subhead">资料候选 .2 · 保存配置v${state.saved} / 正在使用v${state.active} 分别核对</p></section><section class="pane detail-pane review-usage"><div class="section-title"><h3>完整用途与实际范围</h3><span class="subhead">2条规则</span></div><p class="subhead">资料版本与配置版本不同；这是当前候选的使用关系，不改写过去记录。</p>${usageMarkup()}</section></div>`}
function render(){const m=modes[state.mode];frame.className=`frame ${m.platform} ${m.rail?'rail':''} ${m.narrow?'narrow':''} ${m.touch?'touch':''} ${m.landscape?'landscape':''}`;frame.style.setProperty('--fw',m.w+'px');frame.style.setProperty('--fh',m.h+'px');frame.innerHTML=`<div class="platform-bar"><span>${m.platform==='android'?'9:41':'sakamoto · Linux 本机'}</span><span>${m.platform==='android'?'▂▄▆　▰':'—　□　×'}</span></div><div class="work"><nav class="sidebar" aria-label="工作入口"><div class="brand">${m.rail?'S':'sakamoto'}</div>${[['overview','⌁','概览'],['app','≋','活动'],['list','☷','联网安排']].map(([v,icon,label])=>`<button class="nav-button ${state.view===v||(v==='list'&&state.view==='review')?'active':''}" data-action="nav" data-view="${v}" aria-label="${label}"><span class="nav-icon" aria-hidden="true">${icon}</span><span>${label}</span></button>`).join('')}<div class="sidebar-bottom">${linux()?'Linux · 本机':'Android · 平板'}<br>记录保存在本机</div></nav><main class="main">${pageHead()}<div class="content ${narrow()&&state.detail?'record-mode':''}" id="content">${state.view==='overview'?overview():state.view==='app'?appView():state.view==='list'?listView():reviewView()}</div></main></div>${modalMarkup()}`;sync();bind();scale();if(state.view==='review'&&state.reviewScroll)frame.querySelector('#content').scrollTop=state.reviewScroll;}
function sync(){document.querySelector('#mode').value=state.mode;document.querySelector('#view').value=state.view;document.querySelector('#scenario').value=state.scenario;document.querySelector('#scope-label').textContent=linux()?'Linux UID 控制边界保持；触控/窄窗不变 Android':'Android 个人/工作资料与共享UID边界保持';const q=new URLSearchParams({mode:state.mode,view:state.view});history.replaceState(null,'','?'+q.toString())}
function scale(){const m=modes[state.mode],choice=document.querySelector('#scale').value,k=choice==='fit'?Math.min(1,(innerWidth-48)/m.w):Number(choice);frame.style.transform=`scale(${k})`;const space=document.querySelector('#scale-space');space.style.width=m.w*k+'px';space.style.height=m.h*k+'px';document.querySelector('#size-label').textContent=`原框 ${m.w}×${m.h} · 显示 ${Math.round(k*100)}%${m.touch?' · 触控布局':''}`}
function openModal(kind){state.returnFocus=document.activeElement?.dataset.action||null;if(state.view==='review')state.reviewScroll=frame.querySelector('#content').scrollTop;state.modal=kind;render();setTimeout(()=>frame.querySelector('.dialog input,.dialog button')?.focus(),0)}
function modalMarkup(){if(!state.modal)return '';const s=subject(),r=records().find(r=>r.id===state.record)||records()[0];let heading='',body='',actions='<button class="secondary" data-action="close-modal">返回原任务</button>';if(state.modal==='source'){heading='订阅来源';body=`<p>跟踪域名 · 当前资料${state.version}<br>候选2026.09.29.2来自同一来源。核对后返回同一次审阅。</p><label class="field">订阅文件地址<input id="source-input" value="${state.source}" type="url"></label><label class="field">文件格式<select><option>每行一个精确域名</option><option>名称及子域范围</option></select></label><label class="field">检查安排<select id="check-input"><option value="on" ${!state.checkPaused?'selected':''}>每天检查新资料</option><option value="paused" ${state.checkPaused?'selected':''}>暂停检查；当前内容仍使用</option></select></label>`;actions+='<button class="primary" data-action="source-save">保存来源安排</button>';}else if(state.modal==='usage'){heading='使用跟踪域名';body=`<p>${linux()?'共同用于js（UID1000）的连接与查询规则':'共同用于Firefox、Signal的连接与天气的查询规则'}；这是使用关系，不能把名单当阻止开关。</p>${usageMarkup()}`;}else if(state.modal==='decision'){heading=`调整以后的${r.kind==='dns'?'查询':'连接'}`;body=`<p>${s.name} · ${r.name} · ${r.kind==='dns'?'名称查询':'连接'}<br>${linux()?'这一决定作用js（UID1000），会共同影响同身份程序。':s.meaning||'当前作用对象保持所选应用。'}</p><label class="field">以后怎样处理<select id="decision-action"><option>允许</option><option>阻止</option></select></label><label class="check"><input id="descendants" type="checkbox">包含这个名称及子域名</label><p>这是以后使用的规则；不改变${r.time}的旧事实。</p>`;actions+='<button class="primary" data-action="decision-save">应用这个有范围的决定</button>';}else if(state.modal==='decision-result'){heading='这项决定已开始使用';body=`<p>${s.name} · ${r.name} · ${r.kind==='dns'?'名称查询':'连接'}<br>已保存配置v43 · 正在使用v43<br>开始使用后核对同目标、同类型的新实际记录；没有新记录就尚无验证证据。</p>`;actions='<button class="secondary" data-action="close-modal">完成，回原事实</button><button class="primary" data-action="verify">核对后续活动</button>';}else if(state.modal==='verify'){heading='开始使用后的实际活动';body=`<p>${s.name} · ${r.name} · ${r.kind==='dns'?'名称查询':'连接'}<br>09:42起 · 同一名称范围</p><section class="section-rule"><h4>尚无新实际记录</h4><p>修改开始使用与实际访问得到什么结果是不同证据。可以查看现在完整安排，原${r.time}事实保留。</p></section>`;}else if(state.modal==='checks'){heading='更多检查';body='<p>预演用合成事实检查预计决定；观察一段锁定未来窗口，使用普通持续记录。诊断只用于额外判断/阶段证据。</p><div class="detail-actions"><button class="primary" data-action="preview">预演一次活动</button><button class="secondary" data-action="future">观察一段实际活动</button><button class="link" data-action="diagnostic">深入诊断</button></div>';}else if(state.modal==='snapshot'){heading=`${s.name} · 当前连接`;body=`<p>最新连接快照09:41</p><section class="section-rule"><h4>api.weather.example</h4><p>仍保持 · 近10秒发出180B/s<br>这里是当前快照，回原任务恢复${periodText()}及选中记录。</p></section>`;}else if(state.modal==='arrangement'){heading=`${s.name} · 现在的联网安排`;body=`<p>${s.profile}${linux()?'<br>共同影响同UID的Firefox、音乐等程序。':''}</p><section class="usage"><h4>按不同条件处理</h4><p>当前规则、使用关系、来源与有效顺序在这里维护；历史事实继续使用当时配置v42。</p><button class="link" data-action="usage">查看共享使用关系</button></section>`;}else if(state.modal==='historical-list'){heading='那次查询的名单依据';body='<p>09:24查询 · 配置v42 · 资料2026.09.29.1<br>metrics.example.net匹配名称及子域范围；api.metrics精确排除不覆盖本名称。</p><section class="section-rule"><h4>当时与现在分开</h4><p>当前名单更新不重写那次结果；这里核对的是记录保存的依据。</p></section>';}else if(state.modal==='filter'){heading='筛选这段活动';body='<label class="field">目标名称或IP<input id="record-filter" placeholder="metrics.example.net"></label><label class="field">实际结果<select><option>全部结果</option><option>查询被阻止</option><option>连接有传输</option></select></label><p>筛选保留控制身份与当前观察范围。</p>';actions+='<button class="primary" data-action="filter-save">查看筛选结果</button>';}else if(state.modal==='preview'){heading='预演一次活动';body=`<p>${s.name} · ${s.profile}</p><label class="field">活动类型<select id="preview-type"><option value="dns">名称查询</option><option value="connection">连接</option></select></label><label class="field">目标名称或IP<input value="metrics.example.net"></label><label class="field">配置快照<select><option>正在使用v${state.active}</option><option>已保存v${state.saved}</option><option>本次待提交输入</option></select></label><p>查询与连接使用不同事实集合；缺少事实标不足，不拿连接端口冒充DNS查询。</p>`;actions+='<button class="primary" data-action="preview-run">检查预计结果</button>';}else if(state.modal==='edit-list'){heading='修改名单内容';body='<p>这份名单供全部列出的规则共享。只为一个应用允许，应回该对象的局部决定。</p><label class="field">本地补充名称<input value="local.example.net"></label><label class="field">本名单排除名称<input value="api.metrics.example.net"></label><label class="check"><input type="checkbox">排除名称及子域名</label>';actions+='<button class="primary" data-action="list-save">保存本地内容</button>';}else if(state.modal==='assign'){heading='调整使用对象';body=linux()?'<p>js（UID1000）是共同控制身份，不能在此把Firefox和音乐拆成独立执行范围。</p><label class="check"><input type="checkbox" checked>js · UID1000</label>':'<p>共同使用「阻止统计域名」的两个应用；移除一处使用不删除规则。</p><label class="check"><input id="assign-firefox" type="checkbox" checked>Firefox · 个人</label><label class="check"><input type="checkbox" checked>Signal · 个人</label>';actions+='<button class="primary" data-action="assign-save">更新使用对象</button>';}else{heading='继续此任务';body='<p>这个入口保留当前对象与范围，在完整产品中继续对应的观察或管理工作。</p>';}
return `<div class="modal-shade"><section class="dialog" role="dialog" aria-modal="true" aria-label="${heading}"><h3>${heading}</h3>${body}<div class="dialog-actions">${actions}</div></section></div>`}
function bind(){frame.querySelectorAll('[data-action]').forEach(el=>el.addEventListener(el.tagName==='SELECT'?'change':'click',()=>act(el)));const search=frame.querySelector('#app-search');search?.addEventListener('input',()=>{frame.querySelectorAll('.app-row').forEach(row=>row.hidden=!row.dataset.search.toLowerCase().includes(search.value.toLowerCase()))});frame.querySelectorAll('.record').forEach(el=>el.addEventListener('keydown',event=>{if(['ArrowDown','ArrowUp'].includes(event.key)){event.preventDefault();const rows=[...frame.querySelectorAll('.record')],next=rows[Math.max(0,Math.min(rows.length-1,rows.indexOf(el)+(event.key==='ArrowDown'?1:-1)))];state.record=next.dataset.record;render();frame.querySelector(`[data-record="${state.record}"]`)?.focus();}}));frame.querySelector('.modal-shade')?.addEventListener('keydown',e=>{if(e.key==='Escape'){state.modal=null;render();frame.querySelector(`[data-action="${state.returnFocus}"]`)?.focus();}if(e.key==='Tab'){const focusables=[...frame.querySelectorAll('.dialog button,.dialog input,.dialog select')].filter(x=>!x.disabled),first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});}
function act(el){const action=el.dataset.action;if(action==='period'){state.period=el.value;state.future=false;state.detail=false;render();}else if(action==='slot'){state.period=Number(el.dataset.index)===2?'peak':'t'+el.dataset.index;intent('已选'+slots[Number(el.dataset.index)]+'；图中收发、右侧贡献与进入应用范围保持一致。');render();}else if(action==='reset-period'){state.period='all';render();}else if(action==='app'){state.subject=el.dataset.subject;state.view='app';state.type=slotIndex()!==null?'connection':'all';state.record=state.type==='connection'?'connection-api':'dns-block';state.detail=false;state.future=false;render();}else if(action==='nav'){state.view=el.dataset.view;state.detail=false;state.future=false;render();}else if(action==='back'){if(state.detail){state.detail=false}else state.view=state.view==='review'?'list':state.view==='list'?'overview':'overview';render();}else if(action==='type'){state.type=el.dataset.type;state.detail=false;render();frame.querySelector(`[data-type="${state.type}"]`)?.focus();}else if(action==='record'){state.record=el.dataset.record;state.detail=!!narrow();render();if(!narrow())frame.querySelector(`[data-record="${state.record}"]`)?.focus();}else if(action==='record-back'){state.detail=false;render();frame.querySelector(`[data-record="${state.record}"]`)?.focus();}else if(action==='review'){state.view='review';state.reviewScroll=0;render();}else if(action==='defer'){state.view='list';intent('暂未采用候选.2；当前资料.1及使用关系保留。再次审阅可回同一候选。');render();}else if(action==='adopt'){state.version='2026.09.29.2';state.saved=43;state.active=43;state.adopted=true;state.view='list';intent('示意结果：资料.2已保存并开始使用，配置v43；旧09:24事实仍保留当时资料.1/v42。');render();}else if(action==='close-modal'){state.modal=null;render();frame.querySelector(`[data-action="${state.returnFocus}"]`)?.focus();}else if(action==='source-save'){const url=frame.querySelector('#source-input').value;state.checkPaused=frame.querySelector('#check-input').value==='paused';if(url!==state.source){state.source=url;intent('来源地址已修改：旧候选应重新检查，不能直接沿用此前审阅。');}else intent(state.checkPaused?'已暂停检查新资料；目前名单内容、版本和消费者仍使用。':'来源检查安排已保存；当前资料使用不变。');state.modal=null;render();}else if(action==='decision-save'){state.modal='decision-result';render();}else if(action==='verify'){state.modal='verify';render();}else if(action==='future'){state.modal=null;state.view='app';state.future=true;state.detail=false;render();intent('未来一分钟锁定浏览窗口；普通记录持续提供事实，没有另启采集/报告。');}else if(action==='end-future'){state.future=false;intent('结束未来窗口浏览，返回'+periodText()+'；普通记录继续，不停止daemon。');render();}else if(action==='queries'){state.view='app';state.type='dns';state.record='dns-block';state.subject=linux()?'js':'weather';state.detail=false;render();}else if(action==='filter-save'){const q=frame.querySelector('#record-filter').value;state.modal=null;render();frame.querySelectorAll('.record').forEach(row=>row.hidden=q&&!row.innerText.toLowerCase().includes(q.toLowerCase()));intent('已按输入筛选当前范围，类型/对象不变。');}else if(action==='assign-save'){const removed=frame.querySelector('#assign-firefox')&&!frame.querySelector('#assign-firefox').checked;state.modal=null;render();intent(removed?'Firefox不再使用此规则；Signal继续使用；其他来源仍可参与判断。':'使用对象保持当前选择；Linux同UID成员不能伪装成独立控制。');}else if(action==='list-save'){state.modal=null;render();intent('本地内容输入已核对；此示意未增加持久名单或改写历史。');}else if(action==='preview-run'){intent('合成预计结果与真实执行分开；本板只展示类型/目标/快照输入，不调用规则引擎。');}else if(['source','usage','decision','checks','snapshot','arrangement','historical-list','filter','preview','edit-list','assign'].includes(action)){openModal(action)}else if(action==='connections'){openModal('snapshot')}else{intent(action==='diagnostic'?'诊断用于额外判断/阶段证据，具体范围待定义；不能把普通一分钟观察伪装成诊断报告。':action==='directory'?'目录入口保持完整对象范围；此页搜索可筛选可见身份，没有活动的对象也可保留。':action==='stats'?'统计保留同一时段，可进入协议/规则效果视角。':action==='map'?'地图保留同一时段，与目标/地区列表关联；未知位置仍可见。':'保留所选对象与范围，继续对应的完整任务。');}}
document.querySelector('#mode').addEventListener('change',e=>{state.mode=e.target.value;state.subject=linux()?'js':'weather';state.detail=false;state.modal=null;render()});document.querySelector('#view').addEventListener('change',e=>{state.view=e.target.value;state.detail=false;state.modal=null;render()});document.querySelector('#scenario').addEventListener('change',e=>{state.scenario=e.target.value;state.period='all';render()});document.querySelector('#scale').addEventListener('change',scale);addEventListener('resize',scale);render();
